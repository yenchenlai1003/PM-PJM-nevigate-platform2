function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('open');document.getElementById('menu-button').setAttribute('aria-expanded','false')}
function init(){document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();go(b.dataset.page)}));document.getElementById('menu-button').onclick=()=>document.getElementById('sidebar').classList.contains('open')?closeMenu():openMenu();document.getElementById('overlay').onclick=closeMenu;document.getElementById('lang-button').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('navigator-lang',lang);render()};document.getElementById('theme-button').onclick=()=>{theme=theme==='light'?'dark':'light';localStorage.setItem('navigator-theme',theme);applyTheme()};window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(I.zh[p]&&p!==page)go(p)});applyTheme();render()}
function applyTheme(){document.documentElement.dataset.theme=theme;document.getElementById('theme-button').textContent=theme==='light'?'☾':'☀';document.getElementById('theme-button').setAttribute('aria-label',t('切換亮暗模式','Toggle light and dark mode'))}
function common(){document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));document.getElementById('lang-button').textContent=lang==='zh'?'EN':'中文';document.getElementById('breadcrumb').textContent=tr(page);document.getElementById('saved-count').textContent=saved.size;document.getElementById('menu-button').setAttribute('aria-label',t('開啟選單','Open menu'));document.getElementById('theme-button').setAttribute('aria-label',t('切換亮暗模式','Toggle light and dark mode'));document.getElementById('lang-button').setAttribute('aria-label',t('切換語言','Switch language'))}
function header(label,title,desc){return `<div class="page-head"><div class="eyebrow">${label}</div><h1>${title}</h1><p>${desc}</p></div>`}
function home(){return `<div class="hero"><div class="hero-copy"><div class="eyebrow">${t('探索職涯 · 認識自己 · 找到下一步','EXPLORE · REFLECT · TAKE ACTION')}</div><h1>${t('從好奇開始，<br>找到你的 PM／PjM 路徑。','Find your path<br>into PM or PjM.')}</h1><p>${t('看懂兩種角色、拆解職缺要求，用一份簡短 KSA 評估找到現在就能開始的練習。','Understand both roles, read job requirements, and find a practical next step with a short KSA check-in.')}</p><div class="hero-actions"><button class="button primary" data-go="roles">${t('探索角色','Explore roles')}</button><button class="button secondary" data-go="jobs">${t('搜尋職缺','Browse jobs')}</button><button class="button secondary" data-go="ksa">${t('開始 KSA 評估','Start KSA assessment')}</button></div></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="art-card top"><div class="art-label">${t("探索","DISCOVER")}</div><div class="art-title">PM / PjM</div><div class="art-bar"><span style="width:78%"></span></div></div><div class="art-card main"><div class="art-label">${t("你的職涯地圖","YOUR CAREER MAP")}</div><div class="art-title">${t("找到下一步","Find your next move")}</div><div class="art-bar"><span style="width:83%"></span></div><div class="art-bar"><span style="width:58%"></span></div><span class="art-chip">${t("能力洞察","KSA INSIGHTS")}</span></div><div class="art-card mini"><div class="art-label">${t("下一步","NEXT STEP")}</div><div class="art-title">${t("學習與成長","Learn & grow")}</div><div class="art-bar"><span style="width:65%"></span></div></div></div></div><div class="section-head"><div><div class="eyebrow">${t('你的探索順序','A SIMPLE PATH')}</div><h2>${t('先理解，再對照，最後行動','Understand, reflect, then act')}</h2></div></div><div class="grid-3"><div class="card"><div class="feature-icon">◈</div><h3>${t('認識角色','Meet the roles')}</h3><p>${t('從產品方向到專案交付，看懂 PM 與 PjM 各自在做什麼。','See how product direction differs from project delivery.')}</p><div class="card-footer"><button class="link-button" data-go="roles">${t('查看角色比較','Compare roles')}</button></div></div><div class="card"><div class="feature-icon">▤</div><h3>${t('拆解職缺','Read job requirements')}</h3><p>${t('用示範職缺練習辨認工作任務、技能與適合自己的起點。','Practice spotting tasks, skills, and entry points in sample listings.')}</p><div class="card-footer"><button class="link-button" data-go="jobs">${t('查看示範職缺','Browse sample jobs')}</button></div></div><div class="card"><div class="feature-icon">✧</div><h3>${t('找到下一步','Choose a next step')}</h3><p>${t('用六個問題快速盤點 KSA，獲得能立即執行的學習建議。','Check your KSA in six questions and get practical learning ideas.')}</p><div class="card-footer"><button class="link-button" data-go="ksa">${t('開始評估','Start assessment')}</button></div></div></div><div class="note-banner">${t('目前的職缺與實習卡片均為示範資料，不代表實際招募或上市上櫃資格已查核。請透過搜尋連結自行確認最新資訊。','All job and internship cards are illustrative. They do not represent verified openings or listed-company status. Use the search links to check current information.')}</div><div class="section-head"><div><div class="eyebrow">${t("團隊與指導","TEAM & ADVISOR")}</div><h2>${t('組員介紹與工作分配','Team and responsibilities')}</h2></div></div><div class="card team-pending"><h3>${t("團隊資訊整理中","Team details coming soon")}</h3><p>${t("組員姓名與工作分配確認後，將在這裡更新。","Member names and responsibilities will appear here once confirmed.")}</p></div><div class="split-callout"><div><h3>${t('指導老師','Advisor')}</h3><p>PROF. SHIHMIN LO</p></div><span class="tag">PM / PjM Career Navigator</span></div>`}
function roles(){return `${header(t('角色探索','ROLE EXPLORATION'),t('PM 與 PjM，差別在哪裡？','PM and PjM: what is the difference?'),t('名稱相近，但關注點不同。以下是初學者可以用來閱讀職缺的簡化框架；實際職責仍以公司說明為準。','The titles sound similar, but the focus differs. Use this beginner-friendly lens; actual duties depend on each employer.'))}<div class="grid-2"><div class="card role-card"><div class="role-heading"><div class="role-letter">PM</div><div><h2>Product Manager</h2><small>${t('產品經理 · 聚焦「做什麼、為誰做、為何做」','Product direction · What, for whom, and why')}</small></div></div><p>${t('從使用者與商業目標出發，定義問題、規劃產品方向，與團隊決定功能優先順序。','Starts with user needs and business goals, frames problems, and helps decide product priorities.')}</p><ul class="role-list"><li><strong>${t('常見任務：','Typical tasks:')}</strong> ${t('訪談使用者、整理需求、撰寫規格、觀察指標','user research, requirements, specs, metrics')}</li><li><strong>${t('常見 KSA：','Useful KSA:')}</strong> ${t('產品思維、溝通、分析與取捨','product thinking, communication, analysis, trade-offs')}</li><li><strong>${t('入門練習：','Try this:')}</strong> ${t('選一個常用 App，寫出一頁改善提案','write a one-page improvement proposal for an app')}</li></ul></div><div class="card role-card"><div class="role-heading"><div class="role-letter pjm">PjM</div><div><h2>Project Manager</h2><small>${t('專案經理 · 聚焦「如何如期完成」','Project delivery · How to get work done')}</small></div></div><p>${t('把目標轉成可執行計畫，協調人員、時程與風險，讓團隊看見進度並完成交付。','Turns goals into plans, coordinates people and timelines, and makes progress and risks visible.')}</p><ul class="role-list"><li><strong>${t('常見任務：','Typical tasks:')}</strong> ${t('拆解工作、追蹤時程、主持會議、管理風險','task breakdown, schedules, meetings, risks')}</li><li><strong>${t('常見 KSA：','Useful KSA:')}</strong> ${t('規劃、協調、追蹤與應變','planning, coordination, tracking, adaptability')}</li><li><strong>${t('入門練習：','Try this:')}</strong> ${t('替社團活動建立任務表與里程碑','create a task tracker and milestones for a campus event')}</li></ul></div></div><div class="split-callout"><div><h3>${t('不確定自己適合哪一種？','Not sure where you fit?')}</h3><p>${t('先看兩類職缺的日常任務，再用 KSA 評估找出值得練習的能力。','Read the day-to-day tasks in both roles, then use the KSA check-in to choose what to practice.')}</p></div><button class="button purple" data-go="ksa">${t('進行 KSA 評估','Take the KSA check-in')}</button></div>`}
function card(j){const isSaved=saved.has(j.id);return `<article class="card job-card"><div class="job-top"><div class="job-intro"><div class="company-mark">${j.type==='PM'?'P':'J'}</div><div><h3>${j.title[lang]}</h3><small>${j.company[lang]}</small></div></div><button class="save-button ${isSaved?'saved':''}" data-save="${j.id}" aria-label="${t(isSaved?'取消收藏':'收藏',''+(isSaved?'Remove saved job':'Save job'))}" title="${t(isSaved?'取消收藏':'收藏',isSaved?'Remove saved job':'Save job')}">${isSaved?'♥':'♡'}</button></div><div class="job-tags"><span class="tag">${j.type}</span><span class="tag gray">${j.place[lang]}</span><span class="tag gray">${j.mode[lang]}</span><span class="tag gray">${tr('demo')}</span></div><p>${j.req[lang]}</p><div class="job-bottom"><small>${j.skills[lang]}</small><a href="${j.search}" target="_blank" rel="noopener noreferrer">${t('前往平台搜尋','Search on job board')}</a></div></article>`}
function jobs(){let arr=JOBS.filter(j=>(jobType==='all'||j.type===jobType)&&(locationFilter==='all'||j.place.zh===locationFilter)&&(`${j.title[lang]} ${j.company[lang]} ${j.req[lang]}`.toLowerCase().includes(query.toLowerCase())));return `${header(t('職缺探索','JOB EXPLORATION'),t('示範職缺探索','Explore sample jobs'),t('使用示範卡片練習讀懂職缺。公司名稱與職務敘述皆為教學範例，請透過外部平台確認真實職缺與上市上櫃資格。','Use illustrative cards to practice reading listings. Company names and descriptions are samples; verify real openings and listing status on external sources.'))}<div class="note-banner mb-18">${t('示範資料 · 以下卡片不是即時招募資訊；「前往平台搜尋」會開啟相關關鍵字搜尋，而非特定職缺。','Sample data · These cards are not live openings. “Search on job board” opens a keyword search, not a specific posting.')}</div><div class="filter-bar"><input id="job-query" class="search-input" placeholder="${t('搜尋職稱、公司或工作內容','Search title, company, or tasks')}" value="${escapeHtml(query)}" aria-label="${t('搜尋職缺','Search jobs')}"><select id="job-type" class="select-input" aria-label="${t('篩選角色','Filter role')}"><option value="all">${t('所有角色','All roles')}</option><option>PM</option><option>PjM</option></select><select id="job-place" class="select-input" aria-label="${t('篩選地點','Filter location')}"><option value="all">${t('所有地點','All locations')}</option>${[...new Set(JOBS.map(j=>j.place.zh))].map(p=>`<option value="${p}">${JOBS.find(j=>j.place.zh===p).place[lang]}</option>`).join('')}</select></div><div class="job-grid" id="job-grid">${arr.length?arr.map(card).join(''):`<div class="empty">${t('找不到符合條件的示範職缺。','No sample jobs match these filters.')}</div>`}</div>`}
function internships(){return `${header(t('實習起點','INTERNSHIP STARTER'),t('示範實習機會','Sample internship opportunities'),t('不用等到具備所有條件才開始。先從小任務練習需求整理、追蹤進度與跨團隊溝通。','You do not need every skill before you start. Practice discovery, tracking, and team communication through small tasks.'))}<div class="note-banner mb-18">${t('以下實習卡片均為示範資料，並非實際招募。請使用外部搜尋連結查看最新職缺。','The internship cards are illustrative, not active openings. Use the external search links for current listings.')}</div><div class="job-grid">${INTERNS.map(card).join('')}</div><div class="section-head"><div><div class="eyebrow">${t("開始行動","GET STARTED")}</div><h2>${t('尋找實習的三個步驟','Three steps to an internship')}</h2></div></div><div class="steps"><div class="card"><div class="step-num">01</div><h3>${t('選定方向','Pick a direction')}</h3><p>${t('比較 PM 與 PjM 的任務，圈出你有興趣的工作內容。','Compare the tasks in PM and PjM, then highlight what interests you.')}</p></div><div class="card"><div class="step-num">02</div><h3>${t('累積作品','Build proof of work')}</h3><p>${t('用課堂或社團專案，整理一頁需求分析或時程計畫。','Turn a class or club project into a one-page product brief or project plan.')}</p></div><div class="card"><div class="step-num">03</div><h3>${t('持續查核','Check current openings')}</h3><p>${t('到公司招募頁及職缺平台確認工作內容、期限與投遞方式。','Verify tasks, deadlines, and application steps on employer and job board sites.')}</p></div></div>`}
function ksa(){let labels=t(['完全不熟悉','正在學習','曾經練習','可以獨立完成'],['New to this','Learning','Have practiced','Can do independently']);return `${header(t('能力盤點','KSA CHECK-IN'),t('用六個問題，盤點你的起點','Six questions to map your starting point'),t('KSA 代表知識（Knowledge）、技能（Skills）與能力（Abilities）。請依目前經驗作答，沒有標準答案。','KSA stands for Knowledge, Skills, and Abilities. Answer based on your experience; there are no right answers.'))}<div class="card"><div class="ksa-progress"><strong>${t('作答進度：','Progress: ')}${Object.keys(answers).length}/6</strong><div class="progress" role="progressbar" aria-label="${t('作答進度','Assessment progress')}" aria-valuenow="${Object.keys(answers).length}" aria-valuemin="0" aria-valuemax="6"><span style="width:${Object.keys(answers).length/6*100}%"></span></div></div><div class="note-banner" style="margin:0 0 23px">${t('這是探索工具，不是招募測驗或能力認證；結果僅儲存在目前頁面，重新整理後會重置。','This is an exploration aid, not a hiring test or credential. Answers stay on this page and reset on reload.')}</div>${QUESTIONS.map((q,i)=>`<div class="question"><h3>${i+1}. ${q[lang]}</h3><div class="choices" role="group" aria-label="${q[lang]}">${labels.map((x,n)=>`<button class="choice ${answers[i]===n?'selected':''}" data-question="${i}" data-score="${n}" aria-pressed="${answers[i]===n}">${x}</button>`).join('')}</div></div>`).join('')}<div class="button-row mt-30"><button class="button purple" id="show-result" ${Object.keys(answers).length<6?'disabled':''}>${t('查看我的建議','See my suggestions')}</button><button class="button outline" id="reset-ksa">${t('重新作答','Start over')}</button></div></div>${resultVisible?result():''}`}
function result(){let groups=['K','S','A'].map(cat=>({cat,score:QUESTIONS.reduce((a,q,i)=>a+(q.cat===cat?answers[i]:0),0)}));let lowest=[...groups].sort((a,b)=>a.score-b.score)[0].cat;let ideas={K:t(['閱讀兩份 PM 與 PjM 職缺，標出各自的任務與技能。','寫一段話解釋兩種角色的工作焦點。'],['Read two PM and PjM listings, marking tasks and skills.','Explain each role’s focus in one paragraph.']),S:t(['選一個常用 App，寫出一頁問題、使用者與改善提案。','用表格建立一個兩週專案的任務、負責人與截止日。'],['Write a one-page problem and improvement brief for an app.','Track a two-week project with tasks, owners, and deadlines.']),A:t(['參與一次小組專案，練習記錄不同意見與共識。','每週回顧一次優先順序變動，寫下調整原因。'],['Join a small team project and record different views and decisions.','Review shifting priorities weekly and note why they changed.'])};return `<div class="section-head"><div><div class="eyebrow">${t("下一步","YOUR NEXT MOVE")}</div><h2>${t('你的 KSA 概況','Your KSA snapshot')}</h2></div></div><div class="result-grid">${groups.map(g=>`<div class="result-box"><small>${g.cat==='K'?t('知識 Knowledge','Knowledge'):g.cat==='S'?t('技能 Skills','Skills'):t('能力 Abilities','Abilities')}</small><strong>${g.score}/6</strong><div class="progress"><span style="width:${g.score/6*100}%"></span></div></div>`).join('')}</div><div class="card mt-18"><span class="tag">${t('建議先練習','Suggested focus')} · ${lowest}</span><h3 class="mt-18">${t('這週可以開始的兩件事','Two things to try this week')}</h3><ul class="role-list">${ideas[lowest].map(x=>`<li>${x}</li>`).join('')}</ul><p class="mt-18">${t('分數只反映這次的自我描述，請搭配實際作品與回饋調整學習方向。','Scores reflect your self-description today. Use projects and feedback to refine your learning plan.')}</p><div class="button-row mt-18"><button class="button purple" data-go="jobs">${t("查看示範職缺","Explore sample jobs")}</button><button class="button outline" data-go="internships">${t("尋找實習","Explore internships")}</button></div></div>`}
function savedPage(){let items=[...JOBS,...INTERNS].filter(j=>saved.has(j.id));return `${header(t('我的收藏','YOUR SHORTLIST'),t('收藏與比較','Saved roles and comparison'),t('把有興趣的示範卡片放在一起，練習比較工作任務與所需能力。收藏保存在這台裝置的瀏覽器中。','Keep illustrative cards together and compare tasks and skills. Your saved list stays in this browser on this device.'))}${items.length?`<div class="job-grid">${items.map(card).join('')}</div><div class="section-head"><div><div class="eyebrow">${t("比較","COMPARE")}</div><h2>${t('選擇最多三個職務比較','Compare up to three roles')}</h2></div></div><div class="button-row">${items.map(j=>`<button class="choice ${compare.includes(j.id)?'selected':''}" data-compare="${j.id}">${j.title[lang]}</button>`).join('')}</div>${compare.length>=2?compareTable(items.filter(j=>compare.includes(j.id))):`<div class="note-banner">${t('請選擇至少兩個已收藏的職務。','Select at least two saved roles.')}</div>`}`:`<div class="empty">${t('目前沒有收藏。先到職缺搜尋或尋找實習，點選愛心加入。','Nothing saved yet. Use the heart icon in Jobs or Internships.')}</div><div class="button-row mt-18"><button class="button purple" data-go="jobs">${t('探索示範職缺','Browse sample jobs')}</button></div>`}`}
function compareTable(items){return `<div class="card table-wrap mt-18"><table class="compare-table"><tr><th>${t('比較項目','Compare')}</th>${items.map(j=>`<th>${j.title[lang]}</th>`).join('')}</tr><tr><th>${t('角色','Role')}</th>${items.map(j=>`<td>${j.type}</td>`).join('')}</tr><tr><th>${t('地點／型態','Place / type')}</th>${items.map(j=>`<td>${j.place[lang]} · ${j.mode[lang]}</td>`).join('')}</tr><tr><th>${t('工作任務','Tasks')}</th>${items.map(j=>`<td>${j.req[lang]}</td>`).join('')}</tr><tr><th>${t('練習重點','Skills to practice')}</th>${items.map(j=>`<td>${j.skills[lang]}</td>`).join('')}</tr></table></div>`}
function sources(){return `${header(t('方法與來源','METHODS & SOURCES'),t('方法與來源','Methods and sources'),t('網站目前用教學範例呈現流程；以下說明資料如何使用，以及未來上線真實職缺前需要完成的工作。','This prototype uses illustrative content. Here is how it is used and what is needed before real listings can go live.'))}<div class="grid-2"><div class="card"><h3>${t('職缺與實習資料','Jobs and internships')}</h3><p>${t('所有公司名稱、職稱與職務敘述均為自行編寫的示範資料。外部連結只提供關鍵字搜尋，不對應卡片中的特定職缺。尚未驗證上市上櫃資格、招募狀態或更新時間。','All company names, titles, and descriptions are illustrative. External links run keyword searches and do not correspond to the cards. Listed-company status, hiring status, and freshness are unverified.')}</p></div><div class="card"><h3>${t('角色與 KSA 框架','Role and KSA framework')}</h3><p>${t('角色說明以常見產品與專案工作任務整理；KSA 六題是入門自我反思工具，分數依三個面向各兩題加總，最低面向會顯示練習建議。','Role summaries reflect common product and project tasks. The six KSA questions support self-reflection; each category sums two answers, and the lowest category prompts practice ideas.')}</p></div></div><div class="section-head"><div><div class="eyebrow">${t("參考連結","REFERENCE LINKS")}</div><h2>${t('查核真實職缺可從這裡開始','Where to verify real opportunities')}</h2></div></div><div class="card source-list"><div class="source-row"><span>${t('臺灣證券交易所：上市公司查詢','Taiwan Stock Exchange: listed companies')}</span><a href="https://www.twse.com.tw/" target="_blank" rel="noopener noreferrer">TWSE</a></div><div class="source-row"><span>${t('證券櫃檯買賣中心：上櫃公司查詢','Taipei Exchange: OTC companies')}</span><a href="https://www.tpex.org.tw/" target="_blank" rel="noopener noreferrer">TPEx</a></div><div class="source-row"><span>${t('104 人力銀行：職缺關鍵字搜尋','104 Job Bank: keyword search')}</span><a href="https://www.104.com.tw/jobs/search/" target="_blank" rel="noopener noreferrer">104</a></div></div><div class="section-head"><div><div class="eyebrow">${t("後續規劃","NEXT RELEASE")}</div><h2>${t('正式資料上線前的工作','Before real listings go live')}</h2></div></div><div class="steps"><div class="card"><div class="step-num">01</div><h3>${t('選定合法資料來源','Choose a data source')}</h3><p>${t('取得職缺平台授權或使用允許的資料介接方式。','Obtain authorized job board data or an approved integration.')}</p></div><div class="card"><div class="step-num">02</div><h3>${t('核對公司與職缺','Verify each listing')}</h3><p>${t('核對公司上市上櫃身分、原始職缺網址、地點與有效期限。','Check company listing status, source URL, location, and expiry.')}</p></div><div class="card"><div class="step-num">03</div><h3>${t('維護更新日期','Show freshness')}</h3><p>${t('設定固定更新與失效移除流程，並在每筆職缺呈現查核日期。','Refresh and remove expired listings; show a checked date per listing.')}</p></div></div><div class="note-banner">${t('本頁內容更新：2026 年 11 月 24 日。這是網站內容日期，不是職缺資料更新日期。','Page content updated: November 24, 2026. This is not a job listing refresh date.')}</div>`}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){common();main.innerHTML=({home,roles,jobs,internships,ksa,saved:savedPage,sources})[page]();main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));main.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{saved.has(b.dataset.save)?saved.delete(b.dataset.save):saved.add(b.dataset.save);localStorage.setItem('navigator-saved',JSON.stringify([...saved]));compare=compare.filter(id=>saved.has(id));render()});if(page==='jobs'){const q=document.getElementById('job-query');q.oninput=()=>{query=q.value;refreshJobGrid()};document.getElementById('job-type').value=jobType;document.getElementById('job-type').onchange=e=>{jobType=e.target.value;refreshJobGrid()};document.getElementById('job-place').value=locationFilter;document.getElementById('job-place').onchange=e=>{locationFilter=e.target.value;refreshJobGrid()}}if(page==='ksa'){main.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>{answers[+b.dataset.question]=+b.dataset.score;resultVisible=false;render()});document.getElementById('show-result').onclick=()=>{resultVisible=true;render();document.querySelector('.result-grid')?.scrollIntoView({behavior:'smooth',block:'center'})};document.getElementById('reset-ksa').onclick=()=>{answers={};resultVisible=false;render()}}if(page==='saved')main.querySelectorAll('[data-compare]').forEach(b=>b.onclick=()=>{const id=b.dataset.compare;compare=compare.includes(id)?compare.filter(x=>x!==id):compare.length<3?[...compare,id]:[...compare.slice(1),id];render()})}
function refreshJobGrid(){let arr=JOBS.filter(j=>(jobType==='all'||j.type===jobType)&&(locationFilter==='all'||j.place.zh===locationFilter)&&(`${j.title[lang]} ${j.company[lang]} ${j.req[lang]}`.toLowerCase().includes(query.toLowerCase())));document.getElementById('job-grid').innerHTML=arr.length?arr.map(card).join(''):`<div class="empty">${t('找不到符合條件的示範職缺。','No sample jobs match these filters.')}</div>`;document.querySelectorAll('#job-grid [data-save]').forEach(b=>b.onclick=()=>{saved.has(b.dataset.save)?saved.delete(b.dataset.save):saved.add(b.dataset.save);localStorage.setItem('navigator-saved',JSON.stringify([...saved]));render()})}
init();

</script>
</body>
</html>
